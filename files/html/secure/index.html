<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Tahti OS</title>
   <style>
       body {
           margin: 0;
           font-family: Arial, sans-serif;
       }
       .header {
           background-color: tgba(51, 51, 51, 0.66);
           color: white;
           padding: 15px 20px;
           display: flex;
           justify-content: space-between;
           align-items: center;
           position: fixed;
           width: 100%;
           top: 0;
           left: 0;
           z-index: 1000;
       }
       .header h1 {
           margin: 0;
           font-size: 20px;
       }
       .logout-btn {
           background-color: red;
           color: white;
           border-radius: 5px;
           padding: 10px 15px;
           cursor: pointer;
           text-decoration: none;
           transition: background 0.3s;
       }
       .logout-btn:hover {
           background-color: darkred;
       }
       .nav {
           display: flex;
           gap: 15px;
       }
       .nav a {
           color: white;
           text-decoration: none;
           padding: 10px 15px;
           margin: 0 5px;
           background-color: rgba(255, 255,255, 0.2);
           border-radius: 5px;
           transition: background 0.3s;
        }
       .nav a:hover {
           background-color: rgba(255,255,255,0.4);
       }
       .content {
           margin-top: 60px; /* Adjust for fixed header and nav */
           width: 100%;
           height: calc(100vh - 60px);
           border: none;
       }
   </style>
</head>
<body>

   <!-- Header -->
   <div class="header">
       <h1>Tahti Server</h1>
   <!-- Navigation Menu -->
   <div class="nav">
       <a href="panels.html" target="mainFrame">Panels</a>
       <a href="/desktop/vnc.html?autoconnect=true" target="mainFrame">VNC</a>
       <a href="indi.html" target="mainFrame">INDI</a>
    </div>
    <a href="/logout" class="logout-btn">Logout</a>
</div>

   <!-- Content Area -->
   <iframe src="panels.html" class="content" name="mainFrame"></iframe>

</body>
</html>
