<!doctype html>
<html xml:lang="en-gb" lang="en-gb">
  <head>
    <meta charset="UTF-8" />
    <title>Tahti Server</title>
    <link
      rel="icon"
      sizes="16x16"
      type="image/png"
      href="files/Tahti-16x16.png"
    />
    <style>
      <!-- https://www.dafont.com/roboto.font -->
@font-face {
        font-family: "Roboto Light";
        font-style: normal;
        src:
          local("?"),
          url("/files/Roboto-Light.ttf") format("truetype");
      }
      html {
        height: 100%;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #000;
        background-image: url("/files/background.jpg");
        background-repeat: no-repeat;
        background-size: cover;
        background-position: top center;
        font-family: "Roboto Light", Arial, Helvetica;
        color: #fff;
      }
      #welcome {
        background-color: rgba(0, 0, 0, 0.6);
        width: 50%;
        border: 1px #333 solid;
        border-radius: 10px;
        padding: 20px;
        display: block;
        overflow: auto;
        position: relative;
        top: 10%;
        left: 50%;
        transform: translateY(10%) translateX(-50%);
      }
      #connect {
        display: block;
        width: 120px;
        padding: 20px;
        border: 0px solid;
        border-radius: 10px;
        text-align: center;
        color: #fff;
        background-color: #009933;
        font-size: 20px;
        margin: 35px 20px 20px 20px;
        position: relative;
        left: 10%;
        transform: translateX(-10%);
      }
      #connect:hover {
        color: #666;
        background-color: #aaa;
      }
      #credits {
        display: block;
        width: 60%;
        float: left;
        font-weight: bold;
      }
      #credits img {
        width: 30px;
        height: 30px;
        margin-left: 10px;
      }
      #logo {
        display: block;
        width: 40%;
        float: left;
        text-align: right;
      }
      #logo img {
        width: 50px;
        height: 50px;
        position: relative;
        top: -20px;
        left: -40px;
      }
      #particles-js {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 95%;
        z-index: -100;
      }
      a {
        color: #fcba03;
        font-weight: bold;
        text-decoration: none;
      }
      a:visited {
        color: #fcba03;
        font-weight: bold;
        text-decoration: none;
      }
    </style>
    <script src="js/particles.js"></script>
    
  </head>
  <body>
    <div id="particles-js"></div>
    <div id="welcome">
      <h1>Welcome to Tahti OS</h1>
      <p>
        Tahti OS is a ready to use system for Raspberry Pi for controlling
        all your astronomy equipment.<br />Just connect your devices and
        experience the universe.
      </p>

      <h2>Login</h2>
<form method="POST" action="/login?next=/secure/index.html">
  <div id="response"></div>
<label>Username:</label>
<input type="text" name="username" required><br><br>
<label>Password:</label>
<input type="password" name="password" required><br><br>
<button type="submit">Login</button>
</form>

      <p
        id="version"
        style="
          font-size: 1.5em;
          font-weight: bold;
          width: 30%;
          display: block;
          float: left;
          text-align: right;
        "
      ></p>
      <div id="credits">
        <a style="vertical-align: top">Powered by</a>
        <a href="https://www.raspberrypi.org/" target="_blank"
          ><img
            src="/files/raspberry-pi.png"
            alt="Raspberry Pi"
            title="Raspberry Pi"
        /></a>
        <a href="http://indilib.org/" target="_blank"
          ><img src="/files/indilib.png" alt="INDI" title="INDI"
        /></a>
        <a href="https://edu.kde.org/kstars/" target="_blank"
          ><img src="/files/kstars.png" alt="KStars" title="KStars"
        /></a>
        <a href="https://kanaka.github.io/noVNC/" target="_blank"
          ><img src="/files/novnc.png" alt="noVNC" title="noVNC"
        /></a>
      </div>
      <!-- TODO a id="logo" href="https://www.Tahti.io/" target="_blank">Project Site</a>-->
    </div>

   
  </body>
  <script>
    particlesJS.load("particles-js", "js/particles.json", function () {
      console.log("callback - particles.js config loaded");
    });
  </script>
  <script>
    var xmlhttp = new XMLHttpRequest();
    xmlhttp.open("GET", "/version.html", true);
    xmlhttp.addEventListener("load", function () {
      if (this.status === 200) {
        document.getElementById("version").innerHTML = xmlhttp.responseText;
      }
    });
    xmlhttp.send();
  </script>
  <script>
    var urlp=[];s=location.toString().split('?');s=s[1].split('&');for(i=0;i<s.length;i++){u=s[i].split('=');urlp[u[0]]=u[1];}
    let text = urlp['t'] ||  '';
    const decoded = decodeURIComponent(text);
    document.getElementById("response").innerHTML = decoded;
  </script>
</html>
